[project]
name = "agentshowdown"
version = "0.1.0"
description = "Production Python app skeleton with security, testing, and CI/CD baked in"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "structlog>=24.4",
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27",
    "uvicorn[standard]>=0.52.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ty>=0.0.1a14",
    "ruff>=0.7",
    "bandit>=1.7.10",
    "pip-audit>=2.7",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshowdown"]

# ---- Ruff: lint + format (replaces flake8, isort, black, and a chunk of bandit) ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle/pyflakes core
    "I",             # isort
    "S",             # bandit-equivalent security rules
    "B",             # bugbear (common footguns)
    "UP",            # pyupgrade (modern syntax)
    "PT",            # pytest style
    "TID",           # tidy imports
    "TCH",           # typing-only imports
    "ANN",           # require type annotations
    "PERF",          # performance anti-patterns
    "PL",            # pylint subset
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI resolves Pydantic models at runtime to build request validators,
# so TC001 must not push them into a type-checking block -- doing so breaks
# the app at import time. This is ruff's supported way to say that.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; strict annotations and typing-only-import
# hygiene add noise without value; comparing against a literal count or
# status code is clearer than naming a constant; and the "/tmp/..." strings
# here are inert fixture values (a fake repo_path, a path inside a sandbox
# container) that are never opened on the host.
"tests/*" = ["S101", "ANN", "PLR2004", "TC003", "S108"]

# The orchestrator modules ported from ../langlearn. These four rules flag
# argument count and branch count on functions carried over verbatim:
#   sbx.py     -- four functions taking 6-8 config/override arguments
#   vcs.py     -- open_pr(repo, github_repo, branch, base, title, body)
#   job.py     -- _finalize_success(...) and run_job's reattach state machine
# Positional-argument count (PLR0917) was fixed properly by making the tails
# keyword-only. What remains is total argument count and branch count, where
# the honest options were a params-object refactor of faithfully-ported code
# or this ignore. Scoped to these three files so new code stays strict.
"src/agentshowdown/orchestrator/sbx.py" = ["PLR0913"]
"src/agentshowdown/orchestrator/vcs.py" = ["PLR0913"]
"src/agentshowdown/orchestrator/job.py" = ["PLR0913", "PLR0912"]

# ---- ty: fast type checking (Astral), source of truth in CI ----
# ty checks unannotated function bodies too (unlike mypy's default), so
# there's no separate "strict" flag to set — this is the strict behavior.
[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Bump anything you want to be a hard failure rather than a warning.
possibly-missing-import = "error"
unused-ignore-comment = "warn"

# ---- pytest ----
[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]

# ---- Bandit (full pass, supplements Ruff's S-rules in CI) ----
[tool.bandit]
exclude_dirs = ["tests"]
