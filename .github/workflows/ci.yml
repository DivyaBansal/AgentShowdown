name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly dependency vulnerability re-scan — CVEs get published against
    # code you already shipped, so this can't be a PR-only check.
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  UV_VERSION: "0.5.x"

jobs:
  # ---------- Fast feedback: lint, format, types ----------
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install deps (locked)
        run: uv sync --frozen --all-groups
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: ty type check
        run: uv run ty check src/

  # ---------- Security: SAST, dependency audit, secrets ----------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for full-history secret scanning
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install deps (locked)
        run: uv sync --frozen --all-groups
      - name: Bandit full SAST pass
        run: uv run bandit -r src/ -c pyproject.toml
      - name: pip-audit (known CVEs in dependencies)
        run: uv run pip-audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Tests: unit + property-based, coverage gate ----------
  test:
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install deps (locked)
        run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}
      - name: Run tests with coverage gate
        run: uv run pytest
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # ---------- Frontend: lint, types, tests ----------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps (locked)
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test -- --coverage
      - name: npm audit (known CVEs in dependencies)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------- Build, SBOM, sign — only after everything above is green ----------
  build:
    runs-on: ubuntu-latest
    needs: [security, test, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # for keyless signing / trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build wheel
        run: uv build
      - name: Generate SBOM
        run: |
          uvx cyclonedx-py environment -o sbom.json
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: myapp:ci
      - name: Container scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: myapp:ci
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-and-sbom
          path: |
            dist/*
            sbom.json
